# GENERATED FILE — do not edit manually.
# Produced by ghaction and kept in sync by a test.
# To change it, edit action_data.go and run: gotest ./...

name: Deploy with goflare
description: Builds a Go project to WASM and deploys it as a Cloudflare Worker
author: tinywasm
branding:
  icon: upload-cloud
  color: orange
inputs:
  version:
    description: which goflare release to download; empty = resolve automatically
    required: false
  project:
    description: PROJECT_NAME; empty = the value of worker
    required: false
  worker:
    description: WORKER_NAME
    required: true
  domain:
    description: DOMAIN
    required: false
  d1-binding:
    description: D1_DATABASE_NAME
    required: false
  r2-binding:
    description: R2_BUCKET_NAME
    required: false
  compatibility-date:
    description: COMPATIBILITY_DATE
    required: false
  not-found-handling:
    description: NOT_FOUND_HANDLING
    required: false
  setup-go:
    description: run actions/setup-go with the project go.mod
    required: false
    default: 'true'
  vet:
    description: run go vet ./...
    required: false
    default: 'true'
  test:
    description: pattern for go test; empty = do not run tests
    required: false
    default: ./tests/...
  pre-deploy:
    description: command to run between build and deploy
    required: false
  deploy:
    description: 'set to ''false'' on pull requests to build without deploying'
    required: false
    default: 'true'
  cache:
    description: cache the TinyGo tree
    required: false
    default: 'true'
outputs:
  goflare-version:
    description: the version that was resolved and downloaded
    value: '${{ steps.goflare.outputs.version }}'
  tinygo-version:
    description: whatever tinygo version reports
    value: '${{ steps.tinygo.outputs.version }}'
runs:
  using: composite
  steps:
    # The version comes from the project go.mod, so the caller picks it, not us. setup-go also caches ~/go/pkg/mod and ~/.cache/go-build on its own, keyed off go.sum. Via ghaction preset (Node24).
    - name: Setup Go
      if: 'inputs.setup-go == ''true'''
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Resolve and download the goflare binary
      id: goflare
      shell: bash
      run: |
        set -euo pipefail

        version="${{ inputs.version }}"
        if [ -z "$version" ]; then
          ref="${{ github.action_ref }}"
          case "$ref" in
            v[0-9]*.[0-9]*.[0-9]*) version="$ref" ;;
            *)
              # A floating ref such as v1 carries no release number, so ask GitHub
              # which release is current.
              version="$(curl -fsSL https://api.github.com/repos/tinywasm/goflare/releases/latest \
                | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)"
              ;;
          esac
        fi

        # Last resort only. This literal is baked at generation time, so it can never
        # name the tag being released right now.
        if [ -z "$version" ]; then
          version="v0.5.29"
        fi

        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  asset=goflare-linux-amd64 ;;
          Linux-aarch64) asset=goflare-linux-arm64 ;;
          Darwin-arm64)  asset=goflare-darwin-arm64 ;;
          Darwin-x86_64) asset=goflare-darwin-amd64 ;;
          *) echo "goflare: unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac

        url="https://github.com/tinywasm/goflare/releases/download/${version}/${asset}"
        dest="${RUNNER_TEMP}/goflare"

        if ! curl -fsSL "$url" -o "$dest"; then
          echo "goflare: no ${asset} binary in release ${version}." >&2
          echo "  URL: ${url}" >&2
          echo "  The likely cause is that gorelease never ran for that tag." >&2
          echo "  Check https://github.com/tinywasm/goflare/releases and pin a version that does have binaries via the 'version' input." >&2
          exit 1
        fi

        chmod +x "$dest"
        echo "$(dirname "$dest")" >> "$GITHUB_PATH"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    # The installed tree is cached, not the tarball: a hit costs neither a download nor an extraction. The version sits inside the key deliberately. actions/cache keys are immutable — a hit never saves again — so a key without the version stays pinned to a stale tree once the TinyGo version moves, and from then on every run pays the restore plus the full download anyway. The generator keeps this number current.
    - name: Restore the TinyGo cache
      if: 'inputs.cache == ''true'''
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/tinygo
          ~/.local/tinygo
        key: 'tinygo-${{ runner.os }}-${{ runner.arch }}-0.41.1'
    # TinyGo is installed by the goflare binary itself, via tinywasm/tinygo. Using uses: tinywasm/tinygo@v1 is deliberately avoided: that action installs the version of the ref it is invoked with, while sitec resolves it again during the build. That would be two sources, and the day they stop agreeing, sitec uninstalls what the action put there and downloads its own. With the binary as the only installer there is a single source. This step runs before the tests because some projects invoke the bare tinygo binary from PATH during go test.
    - name: Install TinyGo
      id: tinygo
      shell: bash
      run: |
        set -euo pipefail
        out="$(goflare tinygo)"
        bindir="${out#*TINYGO_BINDIR=}"
        bindir="${bindir%%$'\n'*}"
        version="$(printf '%s' "$out" | sed -n 's/^TINYGO_VERSION=//p')"

        if [ -z "$bindir" ]; then
          echo "goflare tinygo returned no bin directory" >&2
          exit 1
        fi

        echo "$bindir" >> "$GITHUB_PATH"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    - name: go vet
      if: 'inputs.vet == ''true'''
      shell: bash
      run: go vet ./...
    - name: go test
      if: 'inputs.test != '''''
      shell: bash
      run: 'go test ${{ inputs.test }}'
    - name: goflare build
      shell: bash
      run: goflare build
      env:
        PROJECT_NAME: '${{ inputs.project || inputs.worker }}'
        WORKER_NAME: '${{ inputs.worker }}'
        DOMAIN: '${{ inputs.domain }}'
        D1_DATABASE_NAME: '${{ inputs.d1-binding }}'
        R2_BUCKET_NAME: '${{ inputs.r2-binding }}'
        COMPATIBILITY_DATE: '${{ inputs.compatibility-date }}'
        NOT_FOUND_HANDLING: '${{ inputs.not-found-handling }}'
    # This is where schema migration goes: it runs once per deploy, not once per isolate start.
    - name: Pre-deploy command
      if: 'inputs.pre-deploy != '''' && inputs.deploy == ''true'''
      shell: bash
      run: '${{ inputs.pre-deploy }}'
    - name: goflare deploy
      if: 'inputs.deploy == ''true'''
      shell: bash
      run: goflare deploy
      env:
        PROJECT_NAME: '${{ inputs.project || inputs.worker }}'
        WORKER_NAME: '${{ inputs.worker }}'
        DOMAIN: '${{ inputs.domain }}'
        D1_DATABASE_NAME: '${{ inputs.d1-binding }}'
        R2_BUCKET_NAME: '${{ inputs.r2-binding }}'
        COMPATIBILITY_DATE: '${{ inputs.compatibility-date }}'
        NOT_FOUND_HANDLING: '${{ inputs.not-found-handling }}'
